# Runs the tests on every push and pull request. CPU only, no model download, no API key:
# tests/conftest.py puts a small stand-in in place of DINOv2, so this checks the code, not the accuracy.
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pillow pandas scikit-learn fastapi uvicorn python-multipart httpx pytest
      - name: Test
        run: pytest -q
